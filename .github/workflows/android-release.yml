name: Android receiver release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTA: no usamos android-actions/setup-android@v3 porque esa accion
      # intenta instalar el paquete legacy "tools" via sdkmanager, paquete
      # que Google elimino del repositorio de Android SDK en versions
      # recientes de cmdline-tools (16.0+). El error tipico es:
      #   Warning: Failed to find package 'tools'
      #   Error: The process '/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager'
      #         failed with exit code 1
      #
      # En ubuntu-latest el Android SDK ya viene pre-instalado con todo lo
      # que este proyecto necesita (compileSdk 34, build-tools 34.0.0,
      # platform-tools, NDK 27 para los .so nativos de OpenCV arm64-v8a).
      # Solo necesitamos aceptar las licencias una vez para que Gradle pueda
      # descargar lo que falte.

      - name: Accept Android SDK licenses
        run: |
          set -e
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # "yes" + sdkmanager --licenses acepta todas las licencias del SDK
          # pre-instalado, necesarias para que Gradle compile sin bloquearse
          # pidiendo aceptacion interactiva.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == android-v* ]]; then
            VERSION="${TAG#android-v}"
          else
            # workflow_dispatch sin tag: usa el numero de run como version de desarrollo
            VERSION="${{ github.run_number }}"
            TAG="android-v${VERSION}-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:test :app:assembleDebug \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version }} \
            --stacktrace

      - name: Rename APK
        id: apk
        run: |
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="android/app/build/outputs/apk/debug/memetransfer-receiver-${{ steps.version.outputs.tag }}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Android receptor ${{ steps.version.outputs.tag }}"
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Build automatico del receptor Android (beta) - APK firmado con el
            keystore de debug fijo del repo (android/debug.keystore), asi que
            se puede instalar encima de una version anterior sin desinstalar.

            La app revisa esta misma lista de releases para autoactualizarse.
