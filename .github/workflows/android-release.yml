name: Android receiver release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == android-v* ]]; then
            VERSION="${TAG#android-v}"
          else
            # workflow_dispatch sin tag: usa el numero de run como version de desarrollo
            VERSION="${{ github.run_number }}"
            TAG="android-v${VERSION}-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:test :app:assembleDebug \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version }} \
            --stacktrace

      - name: Rename APK
        id: apk
        run: |
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="android/app/build/outputs/apk/debug/memetransfer-receiver-${{ steps.version.outputs.tag }}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Android receptor ${{ steps.version.outputs.tag }}"
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Build automatico del receptor Android (beta) - APK firmado con el
            keystore de debug fijo del repo (android/debug.keystore), asi que
            se puede instalar encima de una version anterior sin desinstalar.

            La app revisa esta misma lista de releases para autoactualizarse.
