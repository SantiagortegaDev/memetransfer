org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Beta de una sola arquitectura para acotar el tamano del APK: no hay
# emulador/dispositivo x86 en el flujo de prueba (siempre celulares reales
# arm64), y evita duplicar los .so nativos de OpenCV para cada ABI.
android.defaults.buildfeatures.buildconfig=true
